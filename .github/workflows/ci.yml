name: Numerical and integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m stocklab run --n 1024 --replicates 4
      - run: python -m stocklab calibrate examples/synthetic-demand.csv
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-run-python-${{ matrix.python }}
          path: output/run.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Exercise the interactive application
        run: |
          python -m stocklab serve > /tmp/stocksense.log 2>&1 &
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: output/browser/
