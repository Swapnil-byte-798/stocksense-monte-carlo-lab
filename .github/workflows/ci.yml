name: Numerical, data and Power BI checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[data,dev]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_powerbi.py
      - run: python -m stocklab run --n 1024 --replicates 4
      - run: python -m stocklab backtest
      - run: python -m stocklab calibrate examples/synthetic-demand.csv
      - uses: actions/upload-artifact@v4
        with:
          name: real-run-python-${{ matrix.python }}
          path: output/*.json
  powerbi-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Regenerate scenario mart at smoke-test sample size
        run: python scripts/export_powerbi.py --n 256 --replicates 4
      - run: python scripts/build_powerbi.py
      - run: python scripts/validate_powerbi.py
      - uses: actions/upload-artifact@v4
        with:
          name: powerbi-export-smoke
          path: powerbi/data/export_manifest.json
